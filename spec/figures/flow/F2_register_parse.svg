<g><rect x="410.0" y="36.0" width="280" height="40" rx="20" fill="#e6efe7" stroke="#1b2733" stroke-width="1.5"/><text x="550.0" y="60.0" text-anchor="middle" fill="#1b2733">Start: rows below the REGISTER header</text></g>
<g><rect x="410.0" y="125.4" width="280" height="46" rx="4" fill="#f4f7fb" stroke="#1b2733" stroke-width="1.5"/><text x="550.0" y="152.4" text-anchor="middle" fill="#1b2733">Take the next row</text></g>
<g><polygon points="550.0,211.2 650.0,249.2 550.0,287.2 450.0,249.2" fill="#fff6e3" stroke="#1b2733" stroke-width="1.5"/><text x="550.0" y="253.2" text-anchor="middle" fill="#1b2733">Row empty?</text></g>
<g><polygon points="550.0,328.8 655.0,366.8 550.0,404.8 445.0,366.8" fill="#fff6e3" stroke="#1b2733" stroke-width="1.5"/><text x="550.0" y="370.8" text-anchor="middle" fill="#1b2733">Column A has text?</text></g>
