<text x="665.0" y="357.8" font-size="10" fill="#b23b3b" font-weight="bold">Yes</text>
<polyline points="550.0,404.8 550.0,467.8" fill="none" stroke="#2b3a4a" stroke-width="1.4" marker-end="url(#ar)"/>
