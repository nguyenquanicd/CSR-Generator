<polyline points="550.0,761.4 550.0,799.2" fill="none" stroke="#2b3a4a" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="650.0,837.2 716.0,837.2 716.0,148.4 690.0,148.4" fill="none" stroke="#2b3a4a" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="656.0" y="832.2" font-size="10" fill="#b23b3b" font-weight="bold">Yes: loop</text>
