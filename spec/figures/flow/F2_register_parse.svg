<polyline points="680.0,618.8 765.0,618.8" fill="none" stroke="#2b3a4a" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="690.0" y="609.8" font-size="10" fill="#b23b3b" font-weight="bold">No</text>
<polyline points="550.0,656.8 550.0,711.4" fill="none" stroke="#2b3a4a" stroke-width="1.4" marker-end="url(#ar)"/>
