<g><rect x="400.0" y="467.8" width="300" height="50" rx="4" fill="#f4f7fb" stroke="#1b2733" stroke-width="1.5"/><text x="550.0" y="489.8" text-anchor="middle" fill="#1b2733">Field row: bit name (C), bit range (D),</text><text x="550.0" y="503.8" text-anchor="middle" fill="#1b2733">type (E), reset (F), description (G)</text></g>
<g><polygon points="550.0,580.8 680.0,618.8 550.0,656.8 420.0,618.8" fill="#fff6e3" stroke="#1b2733" stroke-width="1.5"/><text x="550.0" y="615.8" text-anchor="middle" fill="#1b2733">Type is rw, ro, rwi, w1c,</text><text x="550.0" y="629.8" text-anchor="middle" fill="#1b2733">w0c, w2c, r2c or reserved?</text></g>
<g><rect x="765.0" y="598.8" width="170" height="40" rx="20" fill="#e6efe7" stroke="#1b2733" stroke-width="1.5"/><text x="850.0" y="622.8" text-anchor="middle" fill="#1b2733">Message, exit 1</text></g>
<g><rect x="420.0" y="711.4" width="260" height="50" rx="4" fill="#f4f7fb" stroke="#1b2733" stroke-width="1.5"/><text x="550.0" y="733.4" text-anchor="middle" fill="#1b2733">Append the field to the</text><text x="550.0" y="747.4" text-anchor="middle" fill="#1b2733">current register</text></g>
<g><polygon points="550.0,799.2 650.0,837.2 550.0,875.2 450.0,837.2" fill="#fff6e3" stroke="#1b2733" stroke-width="1.5"/><text x="550.0" y="841.2" text-anchor="middle" fill="#1b2733">More rows?</text></g>
<g><polygon points="550.0,925.2 665.0,963.2 550.0,1001.2 435.0,963.2" fill="#fff6e3" stroke="#1b2733" stroke-width="1.5"/><text x="550.0" y="960.2" text-anchor="middle" fill="#1b2733">REPEAT MODE</text><text x="550.0" y="974.2" text-anchor="middle" fill="#1b2733">of the register?</text></g>
<g><rect x="165.0" y="938.2" width="170" height="50" rx="4" fill="#f4f7fb" stroke="#1b2733" stroke-width="1.5"/><text x="250.0" y="960.2" text-anchor="middle" fill="#1b2733">NONE:</text><text x="250.0" y="974.2" text-anchor="middle" fill="#1b2733">one register</text></g>
<g><rect x="700.0" y="931.2" width="300" height="64" rx="4" fill="#f4f7fb" stroke="#1b2733" stroke-width="1.5"/><text x="850.0" y="953.2" text-anchor="middle" fill="#1b2733">PARAMETERIZED: one bank,</text><text x="850.0" y="967.2" text-anchor="middle" fill="#1b2733">PARA_&lt;BASE&gt;_COUNT default COUNT,</text><text x="850.0" y="981.2" text-anchor="middle" fill="#1b2733">limit MAX COUNT, address OFFSET + i*STRIDE</text></g>
<g><rect x="415.0" y="1065.6" width="270" height="64" rx="4" fill="#f4f7fb" stroke="#1b2733" stroke-width="1.5"/><text x="550.0" y="1087.6" text-anchor="middle" fill="#1b2733">FIXED: COUNT copies named</text><text x="550.0" y="1101.6" text-anchor="middle" fill="#1b2733">&lt;base&gt;_0 .. &lt;base&gt;_&lt;COUNT-1&gt;</text><text x="550.0" y="1115.6" text-anchor="middle" fill="#1b2733">at OFFSET + i*STRIDE</text></g>
<g><rect x="410.0" y="1207.0" width="280" height="50" rx="4" fill="#f4f7fb" stroke="#1b2733" stroke-width="1.5"/><text x="550.0" y="1229.0" text-anchor="middle" fill="#1b2733">Check names, alignment, address</text><text x="550.0" y="1243.0" text-anchor="middle" fill="#1b2733">width and overlap</text></g>
<g><rect x="415.0" y="1312.8" width="270" height="40" rx="20" fill="#e6efe7" stroke="#1b2733" stroke-width="1.5"/><text x="550.0" y="1336.8" text-anchor="middle" fill="#1b2733">Registers ready (back to F1)</text></g>
