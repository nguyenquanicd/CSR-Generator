<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1466" viewBox="0 0 1140 1466" font-family="Consolas, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11">
<title>F2  Register table: row classification and repeat expansion</title><rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2b3a4a"/></marker></defs>
<text x="8" y="16" font-size="12" font-weight="bold" fill="#1b2733">F2  Register table: row classification and repeat expansion</text>
<polyline points="550.0,76.0 550.0,125.4" fill="none" stroke="#2b3a4a" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="550.0,171.4 550.0,211.2" fill="none" stroke="#2b3a4a" stroke-width="1.4" marker-end="url(#ar)"/>
<polyline points="550.0,287.2 550.0,328.8" fill="none" stroke="#2b3a4a" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="556.0" y="301.2" font-size="10" fill="#b23b3b" font-weight="bold">No</text>
