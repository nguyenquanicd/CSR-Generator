<text x="556.0" y="889.2" font-size="10" fill="#b23b3b" font-weight="bold">No</text>
<polyline points="435.0,963.2 335.0,963.2" fill="none" stroke="#2b3a4a" stroke-width="1.4" marker-end="url(#ar)"/>
